<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DevBoard — Sign up</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
        h1 { font-size: 1.4rem; margin-bottom: 24px; }
        input[type=email], input[type=password] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 12px; }
        button { padding: 8px 16px; font-size: 0.9rem; cursor: pointer; border: 1px solid #888; border-radius: 4px; background: #f5f5f5; }
        button:hover { background: #e8e8e8; }
        .msg-err { color: #a00; margin-bottom: 12px; }
        .link { margin-top: 16px; font-size: 0.9rem; }
    </style>
</head>
<body>
<h1>DevBoard — Create account</h1>

<p class="msg-err" th:if="${error}" th:text="${error}"></p>

<form method="post" th:action="@{/signup}">
    <input type="email" name="email" placeholder="Email" required autofocus />
    <input type="password" name="password" placeholder="Password (min 8 chars)" required />
    <button type="submit">Sign up</button>
</form>

<p class="link"><a th:href="@{/login}">Already have an account? Log in</a></p>
</body>
</html>
