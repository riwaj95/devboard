<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>DevBoard</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 1.4rem; margin-bottom: 24px; }
        h2 { font-size: 1rem; margin-bottom: 8px; color: #444; }
        .card { border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 24px; }
        input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 8px; }
        button { padding: 8px 16px; font-size: 0.9rem; cursor: pointer; border: 1px solid #888; border-radius: 4px; background: #f5f5f5; }
        button:hover { background: #e8e8e8; }
        .msg-ok  { color: #2a6a2a; margin-top: 8px; }
        .msg-err { color: #a00; margin-top: 8px; }
        .answer  { background: #f9f9f9; border-left: 3px solid #aaa; padding: 10px 14px; margin: 12px 0; white-space: pre-wrap; }
        .sources { font-size: 0.85rem; color: #555; margin-top: 6px; }
        .sources li { margin: 2px 0; }
        .feedback-form { display: inline; }
        .thumb { font-size: 1rem; padding: 4px 10px; }
        .history-item { border-bottom: 1px solid #eee; padding: 12px 0; }
        .history-item:last-child { border-bottom: none; }
        .history-q { font-weight: bold; margin-bottom: 4px; }
        .history-a { white-space: pre-wrap; font-size: 0.9rem; color: #333; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #ddd; font-size: 0.9rem; color: #555; }
        .topbar form { display: inline; margin: 0; }
        .topbar button { padding: 4px 12px; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="topbar">
    <span th:text="${userEmail}"></span>
    <form method="post" th:action="@{/logout}">
        <button type="submit">Logout</button>
    </form>
</div>
<h1>DevBoard</h1>

<!-- Knowledge base panel (populated in Phase 2) -->
<div class="card" id="corpus-panel">
    <h2>Knowledge base</h2>
    <p style="color:#888;">No knowledge base yet. An admin needs to ingest a folder before you can ask questions.</p>
</div>

<!-- Ingest — admins only -->
<div class="card" sec:authorize="hasRole('ADMIN')">
    <h2>Ingest</h2>
    <form method="post" th:action="@{/ingest}">
        <input type="text" name="folderPath" placeholder="/Users/me/devboard-corpus" required />
        <button type="submit">Ingest</button>
    </form>
    <p class="msg-ok"  th:if="${ingestMessage}" th:text="${ingestMessage}"></p>
    <p class="msg-err" th:if="${ingestError}"   th:text="${ingestError}"></p>
</div>

<!-- Ask -->
<div class="card">
    <h2>Ask</h2>
    <form method="post" th:action="@{/ask}">
        <input type="text" name="question" placeholder="Type a question…" required />
        <button type="submit">Ask</button>
    </form>
    <p class="msg-err" th:if="${askError}" th:text="${askError}"></p>

    <div th:if="${qaResult}">
        <div class="answer" th:text="${qaResult.answer}"></div>
        <ul class="sources">
            <li th:each="chunk, stat : ${qaResult.chunks}">
                <span th:text="'[' + (${stat.index} + 1) + '] '"></span>
                <span th:text="${chunk.sourceName}"></span>
                <span style="color:#999; font-size:0.8rem;" th:text="' — ' + ${chunk.sourcePath}"></span>
            </li>
        </ul>
        <form class="feedback-form" method="post" th:action="@{/feedback}">
            <input type="hidden" name="qaId"     th:value="${qaResult.qaId}" />
            <input type="hidden" name="thumbsUp" value="true" />
            <button class="thumb" type="submit">👍</button>
        </form>
        <form class="feedback-form" method="post" th:action="@{/feedback}">
            <input type="hidden" name="qaId"     th:value="${qaResult.qaId}" />
            <input type="hidden" name="thumbsUp" value="false" />
            <button class="thumb" type="submit">👎</button>
        </form>
    </div>
</div>

<!-- History -->
<div class="card" th:if="${not #lists.isEmpty(history)}">
    <h2>History</h2>
    <div class="history-item" th:each="qa : ${history}">
        <div class="history-q" th:text="${qa.question}"></div>
        <div class="history-a" th:text="${qa.answer}"></div>
    </div>
</div>

</body>
</html>
